# Local-only remaps and restart policy. Not used by production compose.
services:
  seaweedfs:
    ports: !override
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8887:8888"
      - "127.0.0.1:8333:8333"
  grafana:
    ports: !override
      - "127.0.0.1:33000:3000"
  rocketmq-namesrv:
    restart: unless-stopped
  rocketmq-broker:
    restart: unless-stopped
    # JDK 8u372 + host cgroup v2: StoreUtil.<clinit> NPEs in
    # CgroupV2Subsystem.getInstance, then every Pull fails with
    # NoClassDefFoundError. Disable container metrics so OS MXBean works.
    environment:
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -server -Xms512m -Xmx512m -XX:-UseContainerSupport"
