worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-xbh.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream xbh_front {
        server 127.0.0.1:3003;
    }

    upstream xbh_gateway {
        server 127.0.0.1:8888;
    }

    upstream xbh_media {
        server 127.0.0.1:8333;
    }

    server {
        listen 3002;
        listen [::]:3002;
        server_name _;

        # Host must keep the client's original host:port ($http_host). $host
        # strips the port, so DWDS builds debug callback URLs without it, the
        # WebSocket handshake fails, Dart main() never runs and the app blank-
        # screens with no console error. See NOTES.md pitfall #18.

        location /api/v2/assistant/chat {
            proxy_pass http://xbh_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 10m;
            add_header X-Accel-Buffering no always;
        }

        location /api/ {
            proxy_pass http://xbh_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /xbh-media/ {
            proxy_pass http://xbh_media;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Flutter web engine assets (CanvasKit/Skwasm) are served by the dev
        # server itself from <app>/web/canvaskit/ (symlinked by stack.sh) and
        # reach the browser through this same-origin entry.

        location / {
            proxy_pass http://xbh_front;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            # fonts.gstatic.com is allowed for the CJK web font (Noto Sans SC) that
            # release builds pull from Google Fonts; self-host as follow-up.
            # Mitigates the plaintext-token-in-localStorage exposure (XSS
            # escalation barrier) for the Flutter web client. Directives are
            # the canonical Flutter web set: wasm-unsafe-eval for CanvasKit,
            # blob: workers, inline styles, data: fonts. picsum.photos is the
            # mock-mode image host; real media is same-origin /xbh-media/.
            # If a violation blank-screens the app after a toolchain upgrade,
            # switch the header name to Content-Security-Policy-Report-Only
            # and check the browser console before tightening.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://picsum.photos; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://fonts.gstatic.com; # engine fetch()es CJK font shards, governed by connect-src. worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        }
    }
}
